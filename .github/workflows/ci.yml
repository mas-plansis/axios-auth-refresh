name: Package CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check built exports
        run: |
          node -e "require('node:assert/strict').equal(typeof require('.').axiosAuthRefresh, 'function')"
          node --input-type=module -e "import { axiosAuthRefresh } from './dist/index.js'; if (typeof axiosAuthRefresh !== 'function') process.exit(1)"
      - name: Check public files
        run: |
          test ! -d src
          test ! -d tests
          test -z "$(find . -path './.git' -prune -o -name '*.map' -print)"
      - run: npm pack --dry-run --ignore-scripts
