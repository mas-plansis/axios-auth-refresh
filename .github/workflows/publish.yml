name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - 'dist/**'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mas-plansis/axios-auth-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check package version
        run: |
          node <<'NODE'
          const { name, version } = require('./package.json');
          if (name !== '@plansis/axios-auth-refresh' ||
              !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Expected @plansis/axios-auth-refresh with a stable X.Y.Z version');
          }
          NODE
      - name: Check built exports
        run: |
          node -e "require('node:assert/strict').equal(typeof require('.').axiosAuthRefresh, 'function')"
          node --input-type=module -e "import { axiosAuthRefresh } from './dist/index.js'; if (typeof axiosAuthRefresh !== 'function') process.exit(1)"
      - name: Check public files
        run: |
          test ! -d src
          test ! -d tests
          test -z "$(find . -path './.git' -prune -o -name '*.map' -print)"
      - run: npm pack --dry-run --ignore-scripts
      - name: Publish with OIDC
        run: npm publish --access public --provenance
